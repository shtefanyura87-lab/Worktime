<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1E1E1E"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Time Calculator</title>
<style>

.r{display:flex;align-items:center;gap:6px}.A{height:54px}.A>*{height:100%}

.rt{height:38px;width:88px;color:var(--a);font-weight:bold;font-size:16px}
#rsb{display:block;margin:10px auto;color:var(--h);font-size:11px}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:9}#ov.o{display:flex}
#box{background:var(--c);width:100%;max-height:90dvh;overflow:auto;padding:16px 16px 28px;border-radius:16px 16px 0 0;display:flex;flex-direction:column;gap:8px}
#box h3{color:var(--a)}#box>label{font-size:11px;color:var(--s);margin-top:6px}.rd{display:flex;gap:10px;align-items:center}.rd input{width:18px;height:18px;accent-color:var(--a)}
.b{flex:1;height:44px}.p{background:var(--a);color:#121212;font-weight:bold}
.li{display:flex;align-items:center;background:var(--i);border-radius:8px;padding:8px 12px}.li>div{flex:1}.li small{display:block}.li .x{background:none;font-size:18px}
.big{font-size:56px;font-weight:bold;color:var(--a);text-align:center}.tap{width:200px;height:200px;border-radius:50%;align-self:center;background:#03dac61a;border:2px solid var(--a);color:var(--a);font-size:22px;font-weight:bold;margin:8px}

</style></head><body>
<header><b>TIME CALC</b><select id="hs"></select><button id="lb"></button><button id="cg" style="font-size:20px;color:#888">⚙</button></header>
<main><div id="list"></div><button id="rsb" class="ghost"></button></main>
<div id="ov"><div id="box"></div></div><div id="tb"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),g=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const md=(a,b)=>((a%b)+b)%b,pad=v=>String(v).padStart(2,'0'),esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()},nowSec=()=>{const d=new Date();return d.getHours()*3600+d.getMinutes()*60+d.getSeconds()};
const rel=(a,s)=>a>=s?a-s:1440-s+a,ft=m=>{m=md(m,1440);return pad(m/60|0)+':'+pad(m%60)},fc=x=>pad(x/3600|0)+':'+pad(x%3600/60|0)+':'+pad(x%60);
const SH=[{s:360,l:600},{s:840,l:1080},{s:1320,l:120}],detect=()=>{const n=nowMin();return n>=360&&n<840?0:n>=840&&n<1320?1:2};
const T={ru:{sh:['1-я смена (06–14)','2-я смена (14–22)','3-я смена (22–06)'],go:'ПРОГНОЗ',obr:'обороты',st:'СТАРТ',set:'НАСТРОЙКИ',rv:'ОБОРОТОВ',sp:'СК/МИН',cl:'ЧИСТКА',sn:'ОТРЕЗКОВ В РУЛОНЕ',ss:'НАЧАТЬ С ОТРЕЗКА',lu:'Учитывать обед',cr:'[ сброс ]',un:'до',fi:'финиш:',tl:'ОБЕД',to:'ВНЕ СМЕНЫ',sg:'Отрезок ',en:'КОНЕЦ РУЛОНА №',cfg:'Настройки',n0:'Не исчезают',n1:'30 секунд',n2:'1 минута',n3:'5 минут',nt:'УВЕДОМЛЕНИЯ ИСЧЕЗАЮТ ЧЕРЕЗ',mc:'КОЛИЧЕСТВО МАШИН',lg:'ЯЗЫК',wl:'Не гасить экран',sa:'Сохранить',ca:'Отмена',ex:'↑ Экспорт машин',im:'↓ Импорт машин',rs:'[ ПОЛНЫЙ СБРОС ]',rq:'Сбросить все настройки и данные?',pk:'Выбор машины',ad:'＋ Сохранить текущую как шаблон',em:'Шаблонов нет',ts:'Измерение скорости',tp:'ТАП',tr:'Сброс',ap:'Применить',th:'Каждый тап = пол-оборота. Пауза 4 с начинает новый замер.',ta:'тапов',wn:'До смены рулона менее 5 минут!',dn:'Рулон готов — пора менять!',lw:'Обед через 5 минут',ew:'Конец смены через 5 минут',ok:'Готово',bn:'Разрешить уведомления',tm:'Время'},
pl:{sh:['1-sza zmiana (06–14)','2-ga zmiana (14–22)','3-cia zmiana (22–06)'],go:'PROGNOZA',obr:'obroty',st:'START',set:'USTAWIENIA',rv:'OBROTÓW',sp:'PR/MIN',cl:'CZYSZCZENIE',sn:'ODCINKÓW W NAWOJU',ss:'ZACZNIJ OD ODCINKA',lu:'Uwzględnij obiad',cr:'[ reset ]',un:'do',fi:'finisz:',tl:'OBIAD',to:'POZA ZMIANĄ',sg:'Odcinek ',en:'KONIEC NAWOJU nr ',cfg:'Ustawienia',n0:'Nie znikają',n1:'30 sekund',n2:'1 minuta',n3:'5 minut',nt:'POWIADOMIENIA ZNIKAJĄ PO',mc:'LICZBA MASZYN',lg:'JĘZYK',wl:'Nie wygaszaj ekranu',sa:'Zapisz',ca:'Anuluj',ex:'↑ Eksport maszyn',im:'↓ Import maszyn',rs:'[ PEŁNY RESET ]',rq:'Zresetować wszystkie ustawienia i dane?',pk:'Wybór maszyny',ad:'＋ Zapisz bieżącą jako szablon',em:'Brak szablonów',ts:'Pomiar prędkości',tp:'TAP',tr:'Reset',ap:'Zastosuj',th:'Każde tapnięcie = pół obrotu. Przerwa 4 s zaczyna nowy pomiar.',ta:'tapnięć',wn:'Do zmiany nawoju mniej niż 5 minut!',dn:'Nawój gotowy — czas wymieniać!',lw:'Obiad za 5 minut',ew:'Koniec zmiany za 5 minut',ok:'Gotowe',bn:'Zezwól na powiadomienia',tm:'Czas'}};
const L=()=>g('lang','ru'),t=k=>T[L()][k];
const curI=()=>g('sh',0),lunch=()=>{const v=g('lm'+curI(),-1);return v>=0?v:SH[curI()].l};
const isCmo=m=>/^cmo/i.test(m.name.trim()),seg=m=>isCmo(m)&&m.segmentCount>0;
const loadM=id=>({id,name:'Машина '+id,totalRevs:5000,speed:100,startTimeMin:360,useLunch:true,cleaningMin:12,segmentCount:0,startSegmentNumber:1,...g('m'+id,{}),id});
// Расписание рулонов — тот же алгоритм, что buildRolls() в Android
function build(m,lm,ss,ov,now){const d=Math.ceil(m.totalRevs/Math.max(.1,m.speed)),lr=rel(lm,ss),out=[];let cur=m.startTimeMin,ld=false;
for(let i=0;i<20;i++){let f,hl=false;
if(ov[i]!=null){f=ov[i];if(!ld&&m.useLunch&&lr<=rel(f,ss))ld=true}
else{const cr=rel(cur,ss);if(m.useLunch&&!ld&&cr<lr&&cr+d>lr){cur+=30;ld=true;hl=true}f=cur+d}
const fr=rel(f,ss),o=fr>480;out.push({i,f:md(f,1440),hl,o,p:rel(now,ss)>fr});if(o)break;cur=f+m.cleaningMin}
return out}
// Только подписи строк (расчёт времени не затрагивается)
function label(m,i){const c=m.segmentCount,st=Math.min(Math.max(m.startSegmentNumber,1),c),z=st-1+i,n=z%c+1;return{n,end:n===c,roll:(z/c|0)+1}}
// ---- UI helpers
const OV=$('#ov'),box=$('#box'),cards=[],al={};
function modal(h){box.innerHTML=h;OV.classList.add('o');return box}const close=()=>OV.classList.remove('o');OV.onclick=e=>{if(e.target===OV)close()};
let tbT;function toast(x){const b=$('#tb');b.textContent=x;b.style.display='block';clearTimeout(tbT);tbT=setTimeout(()=>b.style.display='none',6000)}
let ac;function beep(){try{ac=ac||new AudioContext();const o=ac.createOscillator(),n=ac.createGain();o.connect(n);n.connect(ac.destination);n.gain.value=.15;o.frequency.value=880;o.start();o.stop(ac.currentTime+.4)}catch(e){}}
async function notify(title,body,tag){toast(title+' — '+body);navigator.vibrate&&navigator.vibrate([400,150,400]);beep();
if(!('Notification' in window)||Notification.permission!=='granted')return;const to=g('nt',0);
try{const r=await navigator.serviceWorker.getRegistration(),o={body,tag,icon:'icon-192.png',requireInteraction:to===0};
if(r){await r.showNotification(title,o);if(to)setTimeout(async()=>(await r.getNotifications({tag})).forEach(n=>n.close()),to)}else new Notification(title,o)}catch(e){}}
function pickTime(cur,cb){const b=modal(`<h3>${t('tm')}</h3><input type="time" id="tp" value="${ft(cur)}" style="height:60px;font-size:28px;text-align:center"><div class="r"><button class="b" id="x">${t('ca')}</button><button class="b p" id="y">${t('sa')}</button></div>`);
b.querySelector('#x').onclick=close;b.querySelector('#y').onclick=()=>{const v=b.querySelector('#tp').value;if(v){const[h,mm]=v.split(':').map(Number);cb(h*60+mm)}close()}}
// ---- library
const lib=()=>g('lib',[]);function upsert(d){const l=lib(),i=l.findIndex(x=>x.name.toLowerCase()===d.name.toLowerCase());i>=0?l[i]=d:l.push(d);sv('lib',l)}
function exportLib(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(lib(),null,1)],{type:'application/json'}));a.download='time_calculator_machines.json';a.click();toast(t('ok'))}
function importLib(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const l=JSON.parse(await i.files[0].text());l.forEach(upsert);toast(l.length+' ✓')}catch(e){toast('✗ JSON')}};i.click()}
// ---- card
function Card(id){
const el=document.createElement('div');el.className='card';el.dataset.id=id;
let m=loadM(id),ovr=g('ov'+id,{}),act=g('ta'+id,false),wn=null;
el.innerHTML=`<div class="r A"><span class="h">⠿</span><input class="nm" data-k="name" autocomplete="off"><button data-k="pick" style="width:36px;flex:none">▾</button><input class="cr" data-k="cur" type="number" inputmode="decimal" placeholder="${t('obr')}"><button class="pg" data-k="go">${t('go')}</button><button class="ghost" data-k="ex" style="width:30px;flex:none;font-size:18px">▸</button></div>
<div class="r" style="height:38px;margin-top:4px"><span class="tm" data-k="tm">--:--:--</span><small data-k="rv" style="color:var(--h)"></small><span style="flex:1"></span><small data-k="ul">${t('un')}</small><b data-k="et" style="font-size:18px"></b></div>
<div class="r" style="justify-content:flex-end"><small style="color:var(--h)">${t('fi')}</small><b data-k="lr" style="color:var(--s)"></b></div>
<div data-k="xp" hidden><hr><div class="r" style="gap:8px"><div class="f"><label>${t('st')}</label><button data-k="stb"></button></div><div class="f"><label>&nbsp;</label><button data-k="pb" style="font-size:12px">${t('set')} ▾</button></div></div>
<div class="r" data-k="pp" hidden style="margin-top:8px"><div class="f"><label>${t('rv')}</label><input data-k="rev" type="number" inputmode="numeric"></div><div class="f"><label>${t('sp')}</label><input data-k="spd" inputmode="decimal"></div><div class="f"><label>${t('cl')}</label><input data-k="cln" type="number" inputmode="numeric"></div></div>
<div class="r" data-k="sp2" hidden style="margin-top:8px"><div class="f"><label style="color:var(--p)">${t('sn')}</label><input data-k="sn" type="number" inputmode="numeric" style="color:var(--p)"></div><div class="f"><label style="color:var(--p)">${t('ss')}</label><select data-k="ssel" style="color:var(--p)"></select></div></div>
<div class="r" style="height:48px;margin:6px 0"><label class="lu"><input type="checkbox" data-k="lu"> ${t('lu')}</label><button class="ghost" data-k="clr">${t('cr')}</button></div><div data-k="list"></div></div>`;
const q=k=>el.querySelector('[data-k='+k+']'),saveM=()=>sv('m'+id,m),saveO=()=>sv('ov'+id,ovr),rolls=()=>build(m,lunch(),SH[curI()].s,ovr,nowMin());
function fix(){const s=SH[curI()].s;if([360,840,1320].includes(m.startTimeMin)&&m.startTimeMin!==s){m.startTimeMin=s;saveM()}}
function fill(){q('name').value=m.name;q('rev').value=m.totalRevs;q('spd').value=m.speed;q('cln').value=m.cleaningMin;q('lu').checked=m.useLunch;q('stb').textContent=ft(m.startTimeMin);
q('sn').value=m.segmentCount||'';const c=Math.max(m.segmentCount,1);q('ssel').innerHTML=Array.from({length:c},(_,i)=>`<option ${i+1===Math.min(m.startSegmentNumber,c)?'selected':''}>${i+1}</option>`).join('');q('sp2').hidden=!(isCmo(m)&&!q('xp').hidden)}
function setOv(i,f){ovr[i]=f;for(const k in ovr)if(+k>i)delete ovr[k];saveO()}
function reset(){q('tm').textContent='--:--:--';q('tm').className='tm';q('rv').textContent=''}
function recalc(){const rs=rolls(),cm=seg(m),lst=q('list');lst.innerHTML='';
rs.forEach(r=>{const d=document.createElement('div');d.className='rl';d.style.opacity=(r.p||r.o)?0.35:1;let lb='№'+(r.i+1),cl='';
if(cm){const s=label(m,r.i);lb=s.end?t('en')+s.roll:t('sg')+s.n;cl=s.end?'color:var(--a)':'color:var(--p)'}
d.innerHTML=`<b style="${cl}">${lb}</b><span class="tg">${r.hl?`<i style="color:var(--w)">${t('tl')}</i>`:''}${r.o&&!r.p?`<i style="color:var(--r)">${t('to')}</i>`:''}</span><button class="rt">${ft(r.f)}</button>`;
d.querySelector('.rt').onclick=()=>pickTime(r.f,v=>{setOv(r.i,v);recalc()});lst.append(d)});
const nx=rs.find(r=>!r.p),la=rs.filter(r=>!r.o).pop();q('et').textContent=act&&nx?ft(nx.f):'';q('ul').hidden=!(act&&nx);q('lr').textContent=la?ft(la.f):''}
function finish(msg){act=false;sv('ta'+id,false);el.classList.remove('on');reset();if(msg)notify(msg[0]+' '+m.name,msg[1],'d'+id);recalc()}
function tick(){if(!act||!Object.keys(ovr).length)return;const tg=rolls().find(r=>!r.p);if(!tg)return finish();
let d=tg.f*60-nowSec();if(Math.abs(d)>43200)d+=d<0?86400:-86400;if(d<=0)return finish(['🔔',t('dn')]);
if(d<300&&wn!==tg.i){wn=tg.i;notify('⏰ '+m.name,t('wn'),'w'+id)}if(d>300)wn=null;
q('tm').textContent=fc(d);q('tm').className='tm '+(d<=300?'warn':'run');
q('rv').textContent='~'+Math.max(0,Math.min(m.totalRevs,m.totalRevs-Math.round(d/60*m.speed)))+' об'}
function go(){const cur=Math.trunc(parseFloat(String(q('cur').value).replace(',','.')))||3,tot=m.totalRevs;if(cur>=tot)return;
if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
const n=nowMin(),rt=Math.ceil((tot-cur)/Math.max(.1,m.speed)),ss=SH[curI()].s,lm=lunch();let f=(n+rt)%1440;
if(m.useLunch){const nr=rel(n,ss),lr=rel(lm,ss);if(nr<lr&&nr+rt>lr)f=(f+30)%1440}
setOv(Math.max(0,rolls().findIndex(r=>!r.p)),f);q('cur').value='';act=true;sv('ta'+id,true);el.classList.add('on');wlock();recalc();tick()}
function picker(){const l=lib().slice().sort((a,b)=>a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
const b=modal(`<h3>${t('pk')}</h3>${l.length?l.map((d,i)=>`<div class="li" data-i="${i}"><div><b>${esc(d.name)}</b><small>${d.totalRevs} · ${d.speed} · ${d.cleaningMin}</small></div><button class="x" data-d="${i}">🗑</button></div>`).join(''):`<p>${t('em')}</p>`}<button class="b" id="sa">${t('ad')}</button>`);
b.querySelectorAll('.li').forEach(e=>e.onclick=()=>{const d=l[e.dataset.i];m={...m,name:d.name,totalRevs:d.totalRevs,speed:d.speed,cleaningMin:d.cleaningMin,useLunch:d.useLunch,segmentCount:d.segmentCount||0,startSegmentNumber:d.startSegmentNumber||1};ovr={};saveM();saveO();fill();recalc();close()});
b.querySelectorAll('[data-d]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();sv('lib',lib().filter(x=>x.name!==l[e.dataset.d].name));picker()});
b.querySelector('#sa').onclick=()=>{upsert({name:m.name,totalRevs:m.totalRevs,speed:m.speed,cleaningMin:m.cleaningMin,useLunch:m.useLunch,segmentCount:m.segmentCount,startSegmentNumber:m.startSegmentNumber});close();toast(m.name+' ✓')}}
function tapDlg(){let tt=[],last=0,stale=false,to;const b=modal(`<h3>${t('ts')}</h3><div class="big" id="sv">--</div><div id="tc" style="text-align:center;color:var(--s)">0 ${t('ta')}</div><button class="tap" id="tap">${t('tp')}</button><small style="text-align:center">${t('th')}</small><div class="r"><button class="b" id="trs">${t('tr')}</button><button class="b p" id="tok">${t('ap')}</button></div>`);
const calc=()=>tt.length<2?0:(tt.length-1)*30000/(tt[tt.length-1]-tt[0]),upd=()=>{b.querySelector('#sv').textContent=last?Math.round(last*10)/10:'--';b.querySelector('#tc').textContent=tt.length+' '+t('ta')};
b.querySelector('#tap').onclick=()=>{if(stale){tt=[];stale=false}tt.push(performance.now());const c=calc();if(c)last=c;upd();clearTimeout(to);to=setTimeout(()=>stale=true,4000)};
b.querySelector('#trs').onclick=()=>{tt=[];last=0;stale=false;upd()};
b.querySelector('#tok').onclick=()=>{const v=tt.length>=2?calc():last;if(v>.1){m.speed=Math.round(v*10)/10;saveM();fill();recalc()}clearTimeout(to);close()}}
// listeners
const on=(k,ev,f)=>q(k)[ev]=f;
on('name','oninput',e=>{m.name=e.target.value;saveM();fill();recalc()});
on('rev','oninput',e=>{const v=parseInt(e.target.value);if(v>0){m.totalRevs=v;saveM();recalc()}});
on('spd','oninput',e=>{const v=parseFloat(e.target.value.replace(',','.'));if(v>0){m.speed=Math.max(.1,v);saveM();recalc()}});
on('cln','oninput',e=>{const v=parseInt(e.target.value);if(v>=0){m.cleaningMin=v;saveM();recalc()}});
on('sn','oninput',e=>{m.segmentCount=Math.max(0,parseInt(e.target.value)||0);m.startSegmentNumber=Math.min(m.startSegmentNumber,Math.max(m.segmentCount,1));saveM();fill();recalc()});
on('ssel','onchange',e=>{m.startSegmentNumber=e.target.selectedIndex+1;saveM();recalc()});
on('lu','onchange',e=>{m.useLunch=e.target.checked;if(!act){ovr={};saveO()}saveM();recalc()});
on('ex','onclick',()=>{const h=q('xp').hidden=!q('xp').hidden;q('ex').textContent=h?'▸':'▾';fill()});
on('pb','onclick',()=>{const h=q('pp').hidden=!q('pp').hidden;q('pb').textContent=t('set')+(h?' ▾':' ▴')});

function setShift(i,manual){sv('sh',i);if(!g('lc'+i,false))sv('lm'+i,SH[i].l);$('#lb').textContent=ft(lunch());$('#hs').value=i;cards.forEach(c=>manual?c.applyShift(i):c.sync())}
